{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Torneo Robot Explota Globos{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}?v=20260425-1">
</head>
<body class="{% block body_class %}public-body{% endblock %}">
    <header class="site-header">
        <div class="container nav">
            <a class="brand brand-lockup" href="{% url 'core:home' %}">
                <img
                    src="https://media2.utp.edu.co/oficinas/15/2024/09/6.logo_hor_azu.png"
                    alt="Universidad Tecnológica de Pereira">
                <span>Robot Explota Globos</span>
            </a>
            <nav>
                <a href="{% url 'core:rules' %}">Reglas</a>
                <a href="{% url 'core:sponsors' %}">Patrocinadores</a>
                <a href="{% url 'participants:team_register' %}">Registro</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <script src="{% static 'js/app.js' %}?v=20260425-1"></script>
</body>
</html>
